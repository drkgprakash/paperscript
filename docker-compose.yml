services:
  # ---------------------------------------------------------------------------
  # Backend - FastAPI Application
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: paperscript-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - paperscript

  # ---------------------------------------------------------------------------
  # Frontend - Next.js Application
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: paperscript-frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend
    networks:
      - paperscript

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: paperscript-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paperscript}
      POSTGRES_USER: ${POSTGRES_USER:-paperscript}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paperscript}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paperscript}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - paperscript

  # ---------------------------------------------------------------------------
  # Redis Cache & Pub/Sub
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: paperscript-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - paperscript

  # ---------------------------------------------------------------------------
  # MinIO Object Storage (S3-compatible)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: paperscript-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-paperscript}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-paperscript123}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - paperscript

  # ---------------------------------------------------------------------------
  # LaTeX Compilation Service
  # ---------------------------------------------------------------------------
  latex:
    build:
      context: ./latex-service
      dockerfile: Dockerfile
    container_name: paperscript-latex
    restart: unless-stopped
    # No exposed ports - communicates via shared volumes and Redis queue
    volumes:
      - latex_workdir:/workdir
    networks:
      - paperscript
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

volumes:
  postgres_data:
  redis_data:
  minio_data:
  latex_workdir:

networks:
  paperscript:
    driver: bridge
